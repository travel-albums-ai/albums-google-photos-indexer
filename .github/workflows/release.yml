name: "🚀 Release"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  windows-release:
    name: "🪟 Windows distributions"
    uses: ./.github/workflows/windows-release.yml

  macos-release:
    name: "🍎 macOS distributions"
    uses: ./.github/workflows/macos-release.yml

  ubuntu-release:
    name: "🐧 Ubuntu distributions"
    uses: ./.github/workflows/ubuntu-release.yml

  release:
    name: "📦 Semantic Release"
    needs:
      - windows-release
      - macos-release
      - ubuntu-release
    runs-on: ubuntu-latest

    steps:
      - name: "🧾 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🥟 Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: "📥 Install deps"
        run: bun install

      - name: "📦 Collect platform distributions"
        uses: actions/download-artifact@v4
        with:
          pattern: "*-distributions"
          merge-multiple: true
          path: .

      - name: "🔐 Authenticate to npm"
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: "🧰 Build"
        run: bun run build

      - name: "🏷️ Create release (npm run next)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run next
