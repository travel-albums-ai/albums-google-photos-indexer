name: "🚀 Release"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  windows-release:
    name: "🪟 Windows distributions"
    uses: ./.github/workflows/windows-release.yml

  macos-release:
    name: "🍎 macOS distributions"
    uses: ./.github/workflows/macos-release.yml

  ubuntu-release:
    name: "🐧 Ubuntu distributions"
    uses: ./.github/workflows/ubuntu-release.yml

  release:
    name: "📦 Semantic Release"
    needs:
      - windows-release
      - macos-release
      - ubuntu-release
    runs-on: ubuntu-latest

    steps:
      - name: "🧾 Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🥟 Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: "📥 Install locked dependencies"
        run: bun install --frozen-lockfile

      - name: "📦 Collect platform distributions"
        uses: actions/download-artifact@v8
        with:
          pattern: "*-distributions"
          merge-multiple: true
          path: .

      - name: "🔎 Verify release assets"
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            TravelAlbums-windows-arm64.zip
            TravelAlbums-windows-x64.zip
            TravelAlbums-macos-arm64.tar.gz
            TravelAlbums-macos-x64.tar.gz
            TravelAlbums-ubuntu-arm64.tar.gz
            TravelAlbums-ubuntu-x64.tar.gz
          )
          for asset in "${expected_assets[@]}"; do
            test -f "$asset"
          done

      - name: "🔏 Generate SHA256 checksums"
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            TravelAlbums-windows-arm64.zip \
            TravelAlbums-windows-x64.zip \
            TravelAlbums-macos-arm64.tar.gz \
            TravelAlbums-macos-x64.tar.gz \
            TravelAlbums-ubuntu-arm64.tar.gz \
            TravelAlbums-ubuntu-x64.tar.gz \
            > SHA256SUMS

      - name: "🧰 Build npm package"
        run: bun run build

      - name: "🏷️ Publish npm package and GitHub release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run next
