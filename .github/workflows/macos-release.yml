name: "🍎 macOS Release"

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: "📦 Build macOS distributions"
    runs-on: macos-latest

    steps:
      - name: "🧾 Checkout"
        uses: actions/checkout@v5

      - name: "🥟 Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: "♻️ Cache Bun install cache"
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: "📥 Install deps"
        run: bun install --frozen-lockfile

      - name: "📦 Build macOS distributions"
        run: |
          bun run dist:macos

      - name: "⬆️ Upload macOS distributions"
        uses: actions/upload-artifact@v5
        with:
          name: macos-distributions
          path: TravelAlbums-macos-*.tar.gz
          if-no-files-found: error
