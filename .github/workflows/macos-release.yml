name: "🍎 macOS Release"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: "📦 Build macOS distributions"
    runs-on: macos-latest

    steps:
      - name: "🧾 Checkout"
        uses: actions/checkout@v4

      - name: "🥟 Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: "📥 Install deps"
        run: bun install --frozen-lockfile

      - name: "📦 Build macOS distributions"
        run: |
          bun run dist:macos

      - name: "⬆️ Upload macOS distributions"
        uses: actions/upload-artifact@v4
        with:
          name: macos-distributions
          path: TravelAlbums-macos-*.tar.gz
          if-no-files-found: error
