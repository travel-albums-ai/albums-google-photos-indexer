name: Package ARM64 InnoSetup

on:
  workflow_dispatch:

jobs:
  package-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Build dist-arm64
        run: npm run dist:arm64

      - name: Install Inno Setup (Chocolatey)
        run: choco install innosetup -y

      - name: Generate Inno Setup script
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $appName = $pkg.name
          $outBase = "$($appName)-arm64-$ver"
          $issTemplate = @"
[Setup]
AppName={0}
AppVersion={1}
DefaultDirName={pf}\{0}
DefaultGroupName={0}
OutputBaseFilename={2}
Compression=lzma
SolidCompression=yes

[Files]
Source: "dist-arm64\\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

[Icons]
Name: "{group}\\Run {0}"; Filename: "{app}\\run-arm64.cmd"; WorkingDir: "{app}"

[Run]
Filename: "{app}\\run-arm64.cmd"; Description: "Launch {0}"; Flags: nowait postinstall skipifsilent
"@
          $iss = $issTemplate -f $appName, $ver, $outBase
          $iss | Out-File -FilePath installer-arm64.iss -Encoding ascii

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $isccPath = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-Not (Test-Path $isccPath)) { Write-Error "ISCC.exe not found at $isccPath"; exit 1 }
          & $isccPath installer-arm64.iss

      - name: Upload generated installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-arm64
          path: '*.exe'
